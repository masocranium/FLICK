[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flick-mouse"
version = "0.2.0"
description = "FLICK: record mouse movements, fit swappable models of their features, and generate synthetic movement features for a start point and click target."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest"]
record = ["python-xlib"]

[project.scripts]
flick = "flick.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
